<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duress investigation report · {{ view.id }}</title>
  <style>{{ css|safe }}</style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to report</a>
  <main id="main" class="page-shell report-page">
    <nav class="breadcrumb" aria-label="Breadcrumb"><span>Duress report</span><span aria-hidden="true">/</span><span>{{ view.id }}</span></nav>
    <header class="page-heading"><div><p class="eyebrow">Static investigation report</p><h1>{{ view.target_id }}</h1><p class="heading-detail">{{ view.id }} · {{ view.mode_effective }} · {{ view.status }}</p></div></header>
    {% set interactive = false %}{% include "_investigation_body.html" %}
  </main>
  <footer class="site-footer"><div class="footer-inner"><span>Duress</span><span>Static report · generated from recorded evidence</span></div></footer>
</body>
</html>
