services:
  - type: web
    name: duress
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DURESS_HOSTED
        value: "true"
      - key: DURESS_ROOT
        value: /app
      # The container filesystem is ephemeral: hosted investigations and DNA
      # disappear when the instance restarts. The showcase artifacts are baked
      # into the image instead.
      - key: DURESS_HOME
        value: /tmp/duress
      - key: DURESS_DEMO_TOKEN
        generateValue: true
      # The full investigation UI is enabled. Live model-backed runs use
      # DURESS_LLM_BASE_URL, DURESS_LLM_MODEL and, when required, DURESS_LLM_API_KEY
      # configured in the Render service environment.
