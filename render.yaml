services:
  - type: web
    name: duress
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DURESS_HOSTED
        value: "true"
      - key: DURESS_ROOT
        value: /app
      # The container filesystem is ephemeral: hosted investigations and DNA
      # disappear when the instance restarts. The showcase artifacts are baked
      # into the image instead.
      - key: DURESS_HOME
        value: /tmp/duress
      - key: DURESS_DEMO_TOKEN
        generateValue: true
      # Autonomous model-provider configuration is pending; this web release
      # browses recorded evidence and uses the existing replay/verify services.
