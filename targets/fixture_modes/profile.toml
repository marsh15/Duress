# Fixture-mode control target (plan C.1). Not a realistic integration.
[profile]
id = "fixture-modes"
contract_version = 1
domain = "payments-webhook"

[process]
workers = 1

[seed]
path = "seed.json"
roles = { "order:A" = "order_A", "payment:A1" = "pay_A1", "payment:A2" = "pay_A2", "order:B" = "order_B", "payment:B1" = "pay_B1", "payment:B2" = "pay_B2" }

[signing]
scheme = "hmac-sha256-hex"
header = "X-Razorpay-Signature"
event_id_header = "X-Razorpay-Event-Id"
secret_ref = "env:DURESS_WEBHOOK_SECRET"

[variants.no_sig_check]
id = "fixture-no_sig_check"
workers = 1
init = ["python", "-m", "fixture_modes", "init-db", "--db", "{db}", "--seed", "{seed}", "--mode", "no_sig_check"]
serve = ["python", "-m", "fixture_modes.serve", "--mode", "no_sig_check", "--host", "{host}", "--port", "{port}"]
app = "fixture_modes.app:app"

