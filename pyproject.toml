[project]
name = "duress"
version = "0.1.0"
description = "Put your integrations under pressure. Keep the proof."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
duress = "duress.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duress"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "targets"]
asyncio_mode = "strict"
testpaths = ["targets/razorpay_ref/tests", "tests"]
addopts = "-ra"
markers = [
    "slow: measured experiments and long matrices; not part of the fast gate",
]