[project]
name = "duress"
version = "0.2.0b1"
description = "Put your integrations under pressure. Keep the proof."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
duress = "duress.cli:app"

[dependency-groups]
dev = [
    "playwright>=1.48",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duress"]

[tool.hatch.build.targets.wheel.force-include]
"targets/fixture_modes" = "duress/resources/targets/fixture_modes"
"targets/razorpay_ref/__init__.py" = "duress/resources/targets/razorpay_ref/__init__.py"
"targets/razorpay_ref/__main__.py" = "duress/resources/targets/razorpay_ref/__main__.py"
"targets/razorpay_ref/profile.toml" = "duress/resources/targets/razorpay_ref/profile.toml"
"targets/razorpay_ref/seed.json" = "duress/resources/targets/razorpay_ref/seed.json"
"targets/razorpay_ref/serve.py" = "duress/resources/targets/razorpay_ref/serve.py"
"targets/razorpay_ref/common" = "duress/resources/targets/razorpay_ref/common"
"targets/razorpay_ref/fixed" = "duress/resources/targets/razorpay_ref/fixed"
"targets/razorpay_ref/naive_fix" = "duress/resources/targets/razorpay_ref/naive_fix"
"targets/razorpay_ref/vulnerable" = "duress/resources/targets/razorpay_ref/vulnerable"
fixtures = "duress/resources/fixtures"
showcase = "duress/resources/showcase"

[tool.pytest.ini_options]
pythonpath = [".", "src", "targets"]
asyncio_mode = "strict"
testpaths = ["targets/razorpay_ref/tests", "tests"]
addopts = "-ra"
markers = [
    "slow: measured experiments and long matrices; not part of the fast gate",
    "browser: Playwright UI checks, enabled with DURESS_BROWSER_TESTS=1",
]
